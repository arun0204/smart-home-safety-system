<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Logs - Smart Home Safety</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f8;
        }

        /* Header */

        .header {
            height: 70px;
            background: #17365d;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout {
            background: #e74c3c;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 9px 15px;

            cursor: pointer;
        }

        /* Layout */

        .container {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* Sidebar */

        .sidebar {
            width: 220px;
            background: white;

            padding-top: 20px;

            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08);
        }

        .sidebar a {
            display: block;

            padding: 15px 25px;

            color: #333;
            text-decoration: none;

            font-size: 15px;
        }

        .sidebar a:hover {
            background: #eef3f8;
            color: #17365d;
        }

        .sidebar .active {
            background: #17365d;
            color: white;
        }

        /* Main */

        .main {
            flex: 1;
            padding: 30px;
        }

        .welcome h1 {
            margin: 0;
            color: #17365d;
        }

        .welcome p {
            color: #666;
        }

        /* Logs Card */

        .logs-card {
            background: white;

            margin-top: 25px;

            padding: 25px;

            border-radius: 12px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);

            overflow-x: auto;
        }

        /* Table */

        table {
            width: 100%;
            border-collapse: collapse;

            margin-top: 15px;
        }

        th {
            background: #17365d;
            color: white;

            padding: 14px;

            text-align: left;
        }

        td {
            padding: 14px;

            border-bottom: 1px solid #eee;

            color: #444;
        }

        tr:hover {
            background: #f7f9fb;
        }

        .locked {
            color: #27ae60;
            font-weight: bold;
        }

        .unlocked {
            color: #e74c3c;
            font-weight: bold;
        }

        .refresh-button {
            margin-top: 20px;

            background: #17365d;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 10px 18px;

            cursor: pointer;
        }

        .refresh-button:hover {
            opacity: 0.85;
        }

        .message {
            text-align: center;

            padding: 30px;

            color: #666;
        }

    </style>

</head>


<body>

    <!-- Header -->

    <div class="header">

        <div class="logo">
            🏠 Smart Home Safety
        </div>

        <div class="user-area">

            <span id="userName">
                User
            </span>

            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>


    <div class="container">

        <!-- Sidebar -->

        <div class="sidebar">

            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a href="door-access.html">
                🚪 Door Access
            </a>

            <a href="image-verification.html">
                📷 Image Verification
            </a>

            <a href="sensors.html">
                🌡 Sensors
            </a>

            <a href="alerts.html">
                🚨 Safety Alerts
            </a>

            <a
                href="access-logs.html"
                class="active"
            >
                📋 Access Logs
            </a>

        </div>


        <!-- Main -->

        <div class="main">

            <div class="welcome">

                <h1>
                    📋 Access Logs
                </h1>

                <p>
                    View the history of door access events.
                </p>

            </div>


            <div class="logs-card">

                <h2>
                    Door Access History
                </h2>

                <div id="logsContainer">

                    <div class="message">
                        Loading access logs...
                    </div>

                </div>

                <button
                    class="refresh-button"
                    onclick="loadLogs()"
                >
                    🔄 Refresh Logs
                </button>

            </div>

        </div>

    </div>


    <script>

        // Check login

        const savedUser =
            localStorage.getItem("user");


        if (!savedUser) {

            window.location.href =
                "login.html";

        } else {

            const user =
                JSON.parse(savedUser);

            document
                .getElementById("userName")
                .textContent = user.name;

        }


        // Logout

        function logout() {

            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }


        // Load access logs

        async function loadLogs() {

            const container =
                document.getElementById(
                    "logsContainer"
                );


            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:5000/access-logs"
                    );


                const data =
                    await response.json();


                if (
                    !data.logs ||
                    data.logs.length === 0
                ) {

                    container.innerHTML = `
                        <div class="message">
                            No access logs found.
                        </div>
                    `;

                    return;

                }


                let tableHTML = `

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Event ID
                                </th>

                                <th>
                                    Event Type
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    User ID
                                </th>

                                <th>
                                    Date & Time
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                `;


                data.logs.forEach(
                    function(log) {

                        const statusClass =
                            log.status === "LOCKED"
                                ? "locked"
                                : "unlocked";


                        tableHTML += `

                            <tr>

                                <td>
                                    ${log.event_id}
                                </td>

                                <td>
                                    ${log.event_type}
                                </td>

                                <td
                                    class="${statusClass}"
                                >
                                    ${
                                        log.status === "LOCKED"
                                            ? "🔒 LOCKED"
                                            : "🔓 UNLOCKED"
                                    }
                                </td>

                                <td>
                                    ${log.user_id}
                                </td>

                                <td>
                                    ${new Date(
                                        log.timestamp
                                    ).toLocaleString()}
                                </td>

                            </tr>

                        `;

                    }
                );


                tableHTML += `

                        </tbody>

                    </table>

                `;


                container.innerHTML =
                    tableHTML;


            } catch (error) {

                console.error(
                    "Unable to load access logs:",
                    error
                );


                container.innerHTML = `
                    <div class="message">
                        ❌ Unable to connect to the server.
                    </div>
                `;

            }

        }


        // Load logs when page opens

        loadLogs();

    </script>

</body>

</html>
