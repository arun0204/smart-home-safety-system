<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Safety Alerts - Smart Home Safety</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f8;
        }

        .header {
            height: 70px;
            background: #17365d;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 9px 15px;
            cursor: pointer;
        }

        .container {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        .sidebar {
            width: 220px;
            background: white;
            padding-top: 20px;

            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08);
        }

        .sidebar a {
            display: block;
            padding: 15px 25px;

            color: #333;
            text-decoration: none;
            font-size: 15px;
        }

        .sidebar a:hover {
            background: #eef3f8;
            color: #17365d;
        }

        .sidebar .active {
            background: #17365d;
            color: white;
        }

        .main {
            flex: 1;
            padding: 30px;
        }

        .welcome h1 {
            margin: 0;
            color: #17365d;
        }

        .welcome p {
            color: #666;
        }

        .alert-card {
            background: white;

            margin-top: 25px;
            padding: 25px;

            border-radius: 12px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .alert-item {
            border-left: 5px solid #e74c3c;

            padding: 18px;
            margin-bottom: 15px;

            background: #fff5f5;

            border-radius: 6px;
        }

        .alert-item:last-child {
            margin-bottom: 0;
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-type {
            font-size: 18px;
            font-weight: bold;
            color: #17365d;
        }

        .severity {
            background: #e74c3c;
            color: white;

            padding: 5px 10px;

            border-radius: 5px;

            font-size: 12px;
            font-weight: bold;
        }

        .alert-message {
            margin-top: 10px;
            color: #444;
        }

        .alert-details {
            margin-top: 12px;

            display: flex;
            gap: 25px;

            color: #777;
            font-size: 13px;
        }

        .no-alerts {
            text-align: center;

            padding: 40px;

            color: #27ae60;

            font-size: 18px;
            font-weight: bold;
        }

        .refresh-button {
            margin-top: 20px;

            background: #17365d;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 10px 18px;

            cursor: pointer;
        }

        .refresh-button:hover {
            opacity: 0.85;
        }
    </style>
</head>


<body>

    <!-- Header -->

    <div class="header">

        <div class="logo">
            🏠 Smart Home Safety
        </div>

        <div class="user-area">

            <span id="userName">
                User
            </span>

            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>


    <div class="container">

        <!-- Sidebar -->

        <div class="sidebar">

            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a href="door-access.html">
                🚪 Door Access
            </a>

            <a href="image-verification.html">
                📷 Image Verification
            </a>

            <a href="sensors.html">
                🌡 Sensors
            </a>

            <a
                href="alerts.html"
                class="active"
            >
                🚨 Safety Alerts
            </a>

            <a href="access-logs.html">
                📋 Access Logs
            </a>

        </div>


        <!-- Main -->

        <div class="main">

            <div class="welcome">

                <h1>
                    🚨 Safety Alerts
                </h1>

                <p>
                    Monitor safety alerts detected by the system.
                </p>

            </div>


            <div class="alert-card">

                <h2>
                    Active Alerts
                </h2>

                <div id="alertsContainer">

                    <div class="no-alerts">
                        Loading alerts...
                    </div>

                </div>

                <button
                    class="refresh-button"
                    onclick="loadAlerts()"
                >
                    🔄 Refresh Alerts
                </button>

            </div>

        </div>

    </div>


    <script>

        // Check login

        const savedUser =
            localStorage.getItem("user");


        if (!savedUser) {

            window.location.href =
                "login.html";

        } else {

            const user =
                JSON.parse(savedUser);

            document
                .getElementById("userName")
                .textContent = user.name;

        }


        // Logout

        function logout() {

            localStorage.removeItem("user");

            window.location.href =
                "login.html";

        }


        // Load alerts

        async function loadAlerts() {

            const container =
                document.getElementById(
                    "alertsContainer"
                );


            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:5000/alerts"
                    );


                const data =
                    await response.json();


                container.innerHTML = "";


                if (
                    !data.alerts ||
                    data.alerts.length === 0
                ) {

                    container.innerHTML = `
                        <div class="no-alerts">
                            ✅ No active safety alerts
                        </div>
                    `;

                    return;
                }


                data.alerts.forEach(
                    function(alert) {

                        const alertItem =
                            document.createElement(
                                "div"
                            );

                        alertItem.className =
                            "alert-item";


                        alertItem.innerHTML = `

                            <div class="alert-header">

                                <div class="alert-type">
                                    🚨 ${alert.alert_type}
                                </div>

                                <div class="severity">
                                    ${alert.severity}
                                </div>

                            </div>

                            <div class="alert-message">
                                ${alert.message}
                            </div>

                            <div class="alert-details">

                                <span>
                                    Status: ${alert.status}
                                </span>

                                <span>
                                    User ID: ${alert.user_id}
                                </span>

                                <span>
                                    Time: ${new Date(
                                        alert.timestamp
                                    ).toLocaleString()}
                                </span>

                            </div>

                        `;


                        container.appendChild(
                            alertItem
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Unable to load alerts:",
                    error
                );


                container.innerHTML = `
                    <div class="no-alerts">
                        ❌ Unable to connect to the server
                    </div>
                `;

            }

        }


        // Load alerts when page opens

        loadAlerts();

    </script>

</body>

</html>
