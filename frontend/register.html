<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Home Safety - Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #eef3f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .register-container {
            width: 100%;
            max-width: 1050px;
            min-height: 650px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1.05fr;
            box-shadow: 0 18px 50px rgba(23, 54, 93, 0.15);
        }

        /* =========================
           LEFT PANEL
        ========================== */

        .brand-panel {
            background: linear-gradient(
                145deg,
                #17365d,
                #24568d
            );

            color: white;
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            top: -120px;
            right: -100px;
        }

        .brand-panel::after {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 50%;
            bottom: -100px;
            left: -80px;
        }

        .brand-content {
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: rgba(255,255,255,0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin-bottom: 28px;
            border: 1px solid rgba(255,255,255,0.18);
        }

        .brand-panel h1 {
            font-size: 36px;
            line-height: 1.15;
            margin-bottom: 18px;
            font-weight: 700;
        }

        .brand-panel .description {
            font-size: 16px;
            line-height: 1.7;
            color: rgba(255,255,255,0.82);
            max-width: 400px;
        }

        .features {
            margin-top: 38px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 13px;
            font-size: 14px;
            color: rgba(255,255,255,0.92);
        }

        .feature-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        /* =========================
           RIGHT PANEL
        ========================== */

        .form-panel {
            padding: 55px 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-content {
            width: 100%;
            max-width: 430px;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-header h2 {
            color: #17365d;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #6c757d;
            font-size: 15px;
        }

        /* =========================
           FORM
        ========================== */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #263746;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            border: 1px solid #d6dde5;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 15px;
            color: #263746;
            background: #fbfcfe;
            outline: none;
            transition: 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: #2d6da3;
            background: white;
            box-shadow: 0 0 0 3px rgba(45,109,163,0.10);
        }

        .input-wrapper input::placeholder {
            color: #a0a9b3;
        }

        .password-input {
            padding-right: 52px !important;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            color: #64748b;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            background: #edf2f7;
            color: #17365d;
        }

        /* =========================
           PASSWORD INFO
        ========================== */

        .password-info {
            margin-top: 7px;
            color: #7b8794;
            font-size: 12px;
        }

        /* =========================
           REGISTER BUTTON
        ========================== */

        .register-button {
            width: 100%;
            height: 50px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: #17365d;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .register-button:hover {
            background: #0f2744;
            transform: translateY(-1px);
        }

        .register-button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
            transform: none;
        }

        /* =========================
           MESSAGE
        ========================== */

        #message {
            min-height: 20px;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        /* =========================
           LOGIN LINK
        ========================== */

        .login-link {
            text-align: center;
            margin-top: 24px;
            color: #6c757d;
            font-size: 14px;
        }

        .login-link a {
            color: #17365d;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 850px) {

            .register-container {
                grid-template-columns: 1fr;
                max-width: 520px;
            }

            .brand-panel {
                padding: 38px;
                min-height: 300px;
            }

            .brand-panel h1 {
                font-size: 30px;
            }

            .features {
                margin-top: 25px;
                gap: 12px;
            }

            .form-panel {
                padding: 40px;
            }
        }

        @media (max-width: 520px) {

            body {
                padding: 12px;
            }

            .register-container {
                border-radius: 18px;
            }

            .brand-panel {
                padding: 30px 25px;
            }

            .brand-panel h1 {
                font-size: 27px;
            }

            .brand-panel .description {
                font-size: 14px;
            }

            .form-panel {
                padding: 30px 24px;
            }

            .form-header h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- =========================
             LEFT BRAND PANEL
        ========================== -->

        <div class="brand-panel">

            <div class="brand-content">

                <div class="logo">
                    🏠
                </div>

                <h1>
                    Smart Home<br>
                    Safety
                </h1>

                <p class="description">
                    Create your account and take control of
                    your smart home safety system.
                </p>

                <div class="features">

                    <div class="feature">
                        <div class="feature-icon">🔐</div>
                        <span>Secure door access</span>
                    </div>

                    <div class="feature">
                        <div class="feature-icon">📷</div>
                        <span>Face verification</span>
                    </div>

                    <div class="feature">
                        <div class="feature-icon">🚨</div>
                        <span>Real-time safety alerts</span>
                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             RIGHT FORM PANEL
        ========================== -->

        <div class="form-panel">

            <div class="form-content">

                <div class="form-header">

                    <h2>Create Account</h2>

                    <p>
                        Enter your details to get started.
                    </p>

                </div>


                <form id="registerForm">

                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                required
                            >

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="password"
                                class="password-input"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Show password"
                            >
                                👁
                            </button>

                        </div>

                        <div class="password-info">
                            Use at least 6 characters.
                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                class="password-input"
                                placeholder="Enter your password again"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="toggleConfirmPassword"
                                aria-label="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="register-button"
                        id="registerButton"
                    >
                        Create Account
                    </button>

                </form>


                <div id="message"></div>


                <div class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Sign in
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script>

        const API = "http://127.0.0.1:5001";


        /* =========================
           PASSWORD VISIBILITY
        ========================== */

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const togglePassword =
            document.getElementById("togglePassword");

        const toggleConfirmPassword =
            document.getElementById("toggleConfirmPassword");


        togglePassword.addEventListener(
            "click",
            function() {

                if (password.type === "password") {

                    password.type = "text";

                    togglePassword.textContent = "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    password.type = "password";

                    togglePassword.textContent = "👁";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );
                }

            }
        );


        toggleConfirmPassword.addEventListener(
            "click",
            function() {

                if (confirmPassword.type === "password") {

                    confirmPassword.type = "text";

                    toggleConfirmPassword.textContent = "🙈";

                    toggleConfirmPassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    confirmPassword.type = "password";

                    toggleConfirmPassword.textContent = "👁";

                    toggleConfirmPassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );
                }

            }
        );


        /* =========================
           REGISTRATION
        ========================== */

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const passwordValue =
                        document
                            .getElementById("password")
                            .value;


                    const confirmPasswordValue =
                        document
                            .getElementById("confirmPassword")
                            .value;


                    const message =
                        document.getElementById("message");


                    const registerButton =
                        document.getElementById(
                            "registerButton"
                        );


                    /* =========================
                       VALIDATION
                    ========================== */

                    if (passwordValue.length < 6) {

                        message.textContent =
                            "Password must be at least 6 characters.";

                        message.style.color =
                            "#dc3545";

                        return;
                    }


                    if (
                        passwordValue !==
                        confirmPasswordValue
                    ) {

                        message.textContent =
                            "Passwords do not match.";

                        message.style.color =
                            "#dc3545";

                        return;
                    }


                    /* =========================
                       LOADING
                    ========================== */

                    message.textContent =
                        "Creating your account...";

                    message.style.color =
                        "#17365d";


                    registerButton.disabled = true;

                    registerButton.textContent =
                        "Creating Account...";


                    try {

                        const response =
                            await fetch(
                                API + "/register",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            name: name,
                                            email: email,
                                            password:
                                                passwordValue
                                        })
                                }
                            );


                        const result =
                            await response.json();


                        if (response.ok) {

                            message.textContent =
                                "Account created successfully! Redirecting to login...";

                            message.style.color =
                                "#198754";


                            document
                                .getElementById(
                                    "registerForm"
                                )
                                .reset();


                            setTimeout(
                                function() {

                                    window.location.href =
                                        "login.html";

                                },
                                1500
                            );


                        } else {

                            message.textContent =
                                result.message ||
                                "Registration failed.";

                            message.style.color =
                                "#dc3545";


                            registerButton.disabled =
                                false;

                            registerButton.textContent =
                                "Create Account";
                        }

                    }

                    catch (error) {

                        console.error(
                            "Registration error:",
                            error
                        );


                        message.textContent =
                            "Unable to connect to the server.";

                        message.style.color =
                            "#dc3545";


                        registerButton.disabled =
                            false;

                        registerButton.textContent =
                            "Create Account";
                    }

                }
            );

    </script>

</body>
</html>
